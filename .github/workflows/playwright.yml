name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENV: ci
      BASE_URL: http://localhost:8080
      API_BASE_URL: http://localhost:8080
      TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'orangehrm' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'Admin@0123' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start OrangeHRM (docker compose)
      run: docker compose up -d
    - name: Provision OrangeHRM
      run: docker/install-orangehrm.sh
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Stop OrangeHRM (docker compose)
      if: always()
      run: docker compose down -v
