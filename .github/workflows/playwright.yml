name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        env:
            ENV: ci
            BASE_URL: http://localhost:8080
            API_BASE_URL: http://localhost:8080
            TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'orangehrm' }}
            TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'Admin@0123' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Get installed Playwright version
              id: playwright-version
              run: echo "version=$(npm ls @playwright/test --json | node -pe 'JSON.parse(require("fs").readFileSync(0)).dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
            - name: Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps
            - name: Install Playwright OS dependencies (cache hit)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps
            - name: Start OrangeHRM (docker compose)
              run: docker compose up -d
            - name: Provision OrangeHRM
              run: docker/install-orangehrm.sh
            - name: Run Playwright tests
              run: npx playwright test
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - name: Stop OrangeHRM (docker compose)
              if: always()
              run: docker compose down -v
